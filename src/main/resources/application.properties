# Cloud Nation | Docker Class
# "mysqldb" is the service name in docker-compose.yml: containers on the same network reach each other by name
spring.datasource.url=${DB_URL:jdbc:mysql://mysqldb:3306/sbms?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
# create/update the table "book" automatically
spring.jpa.hibernate.ddl-auto=update
server.port=8080
